name: aliyun-deploy

on:
  push:
    branches: ["main"]
env:
  IMAGE_NAME: registry.cn-beijing.aliyuncs.com/hsuehly/m3u8
  TZ: Asia/Shanghai
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Show the timezone
        run: |
            echo "The timezone is $TZ"
            date
      - uses: actions/checkout@v3
      - name: Set outputs
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Login to Aliyun Registry
        uses: docker/login-action@v2.1.0
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and Push Docker image
        uses: docker/build-push-action@v4.0.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME}}:${{ github.run_number }}-${{ env.sha_short }}
      - name: Deploy App to remote server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /var/www/m3u8_cache
            sed -i 's#IMAGE_NAME=.*#IMAGE_NAME=${{ env.IMAGE_NAME}}:${{ github.run_number }}-${{ env.sha_short }}#g' .env
            docker compose pull
            docker compose down --remove-orphans
            docker compose up -d